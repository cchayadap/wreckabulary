[project]
name = "assetgen"
version = "1.0.0"
description = "Game Studio Kit generation CLI: reserve-before-submit ledger, provider pools, resume by job id, allowlisted outputs, local asset checks, CC0 fetchers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "keyring>=25.0",
  "pillow>=11.3",
  "jsonschema>=4.23",
]

[project.scripts]
assetgen = "assetgen.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assetgen"]

[tool.pytest.ini_options]
addopts = "-q"
