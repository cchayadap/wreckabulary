[project]
name = "gsk-capture"
version = "1.0.0"
description = "Game Studio Kit capture tools: contact sheets, GIFs, Steam store images, progress log (Pillow, no ffmpeg)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=10.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
