[project]
name = "gsk-audio"
version = "1.0.0"
description = "Game Studio Kit audio tools: loudness/true-peak/loop checks, procedural SFX, CC0 fetch (no ffmpeg)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "keyring>=24",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
